name: CD (Docker Build & Push)

on:
  push:
    branches: [ "production" ]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOTNET_PROJECT: ./src/AgroIdentity.Api/AgroIdentity.Api.csproj

    steps:
      - uses: actions/checkout@v4

      # (opcional) Garantir que o build .NET está ok também no CD
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ${{ env.DOTNET_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.DOTNET_PROJECT }} -c Release --no-restore

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}